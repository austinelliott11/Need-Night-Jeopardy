<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nerd Night Jeopardy Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Stencil+Display:wght@800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Gunmetal war room: brass values, blood-red buzzer. Three views: host controls, TV display, player phone. */
  --bg:#0b1116; --board:#14212b; --tile:#1b2d3a; --tile-hi:#24404f; --line:#22384a;
  --brass:#d9a441; --ink:#eef1ea; --mute:#7f939d; --blood:#c0302a; --good:#3f9b5f;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --stencil:"Big Shoulders Stencil Display","Big Shoulders Display",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
input{font-family:inherit}
.hidden{display:none!important}
.logo{font-family:var(--stencil);letter-spacing:.06em;color:var(--brass);margin:0;line-height:1}
.logo span{color:var(--ink)}
.btn{background:transparent;color:var(--ink);border:1px solid #33495a;border-radius:8px;padding:10px 16px;font-size:17px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.btn.primary{background:var(--brass);color:#1a1206;border-color:var(--brass)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:#6b2622;border-color:#8a302a;color:#fff}
.btn.sm{padding:5px 9px;font-size:14px}
.muted{color:var(--mute)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#22384a;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* Landing */
#landing{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#landing .logo{font-size:clamp(40px,9vw,88px)}
#landing .roles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#landing .card{background:var(--board);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
#name,.code-in{font-size:22px;padding:12px;border-radius:8px;border:1px solid #33495a;background:#0f1a22;color:var(--ink);text-align:center}
#status{max-width:520px}

/* Scoreboard strip */
.scores{display:flex;gap:8px;flex-wrap:wrap}
.sc{flex:1 1 120px;background:#101a21;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}
.sc .n{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .p{font-family:var(--display);font-weight:900;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.sc.neg .p{color:var(--blood)}
.sc.pick{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.sc.pick .n{color:var(--brass)}
.sc.you .n::after{content:" (you)"}

/* Board (TV + host) */
.board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto repeat(5,1fr);gap:6px;background:var(--board);padding:6px;border-radius:10px}
.cat{background:#0f1a22;border-bottom:3px solid var(--brass);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 6px;min-height:64px;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(13px,1.5vw,26px);line-height:1.02;letter-spacing:.03em;text-wrap:balance}
.tile{background:var(--tile);border:0;border-radius:4px;color:var(--brass);font-family:var(--display);font-weight:900;font-size:clamp(22px,4vw,70px);font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.tile:hover:not(:disabled){background:var(--tile-hi)}
.tile:disabled{opacity:1;cursor:default}
.tile.used{background:#101a21;color:transparent;text-shadow:none}

/* TV display */
#tv{height:100%;display:flex;flex-direction:column;padding:12px 18px;gap:10px}
#tv header{display:flex;justify-content:space-between;align-items:center;gap:12px}
#tv .logo{font-size:clamp(22px,2.6vw,40px)}
#tv-turn{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(16px,2vw,30px);color:var(--brass)}
#tv-main{flex:1;min-height:0;display:flex;flex-direction:column}
#tv-main .board{flex:1}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3vh;background:var(--board);border-radius:10px;padding:4vh 5vw}
.stage .top{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-size:clamp(16px,1.8vw,28px)}
.stage .top b{color:var(--brass)}
.clue{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(28px,4.4vw,76px);line-height:1.08;max-width:24ch;text-wrap:balance;margin:0}
.ans{font-weight:700;font-size:clamp(24px,3vw,48px);color:var(--brass);margin:0}
.who{font-family:var(--stencil);font-size:clamp(36px,6vw,110px);line-height:1;color:#fff6e8;margin:0}
.light{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(16px,1.8vw,26px)}
.light i{width:18px;height:18px;border-radius:50%;background:#33495a}
.light.on i{background:#e33;box-shadow:0 0 18px #f44}
.dd-splash{background:var(--blood)}
.dd-splash .who{font-size:clamp(60px,11vw,190px)}
@media (prefers-reduced-motion:no-preference){.dd-splash .who{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}@keyframes slam{from{transform:scale(2.2) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}}

/* Host */
#host{min-height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 14px}
#host header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#host .logo{font-size:28px}
#h-board .board{height:min(62vh,560px)}
.hpanel{background:var(--board);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.hpanel .clue{font-size:clamp(22px,3vw,40px);max-width:none}
.secret{background:#0f1a22;border:1px dashed var(--brass);border-radius:8px;padding:8px 12px;color:var(--brass);font-weight:700;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;background:#101a21;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.prow .nm{flex:1;font-weight:600}
.prow .pt{font-family:var(--display);font-weight:900;font-size:22px;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.fa{flex:1;font-weight:600}

/* Player phone */
#player{min-height:100%;display:flex;flex-direction:column;gap:12px;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
#player header{display:flex;justify-content:space-between;align-items:center}
#player .logo{font-size:24px}
#p-main{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center}
.p-msg{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:30px;text-align:center;line-height:1.05;text-wrap:balance;margin:0}
.p-clue{font-size:19px;text-align:center;line-height:1.3;background:var(--board);border-radius:10px;padding:12px;margin:0}
#buzz{width:100%;aspect-ratio:1/1;max-height:52vh;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#e5463e,#9e1f19 70%);color:#fff;font-family:var(--stencil);font-size:clamp(48px,16vw,96px);letter-spacing:.06em;box-shadow:0 10px 0 #5e120e,0 14px 30px rgba(0,0,0,.6);touch-action:manipulation;-webkit-tap-highlight-color:transparent;margin:0 auto;display:block;max-width:52vh}
#buzz:active:not(:disabled){transform:translateY(6px);box-shadow:0 4px 0 #5e120e}
#buzz:disabled{background:#2a3742;box-shadow:0 10px 0 #18222a;opacity:1;color:#56697a}
#buzz.won{background:radial-gradient(circle at 40% 35%,#f2c460,#a87416 70%);box-shadow:0 10px 0 #5b3f0a;color:#1a1206}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.pgrid .cat{font-size:10px;min-height:44px;padding:3px;border-bottom-width:2px}
.pgrid .tile{font-size:16px;padding:12px 0;text-shadow:none}
.big-in{font-family:var(--display);font-weight:800;font-size:34px;padding:10px;border-radius:8px;border:0;text-align:center;width:100%}
.txt-in{font-size:20px;padding:12px;border-radius:8px;border:1px solid #33495a;background:#0f1a22;color:var(--ink);width:100%}
.code-in{letter-spacing:.3em;text-transform:uppercase;font-family:var(--display);font-weight:800;font-size:30px!important}
.codebig{font-family:var(--stencil);color:var(--brass);letter-spacing:.12em}
</style>
</head>
<body>

<section id="landing">
  <h1 class="logo">NERD NIGHT <span>JEOPARDY</span></h1>
  <p id="status" class="muted">Loading…</p>
  <div class="card hidden" id="join-card">
    <label for="code" class="muted">Room code (on the TV)</label>
    <input id="code" class="code-in" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
    <label for="name" class="muted">Your name on the scoreboard</label>
    <input id="name" maxlength="18" autocomplete="nickname" placeholder="Type a name">
    <button class="btn primary" id="btn-join" type="button">Join the game</button>
  </div>
  <div class="roles hidden" id="roles">
    <button class="btn" id="btn-tv" type="button">Show the TV board on this screen</button>
    <button class="btn primary" id="btn-host" type="button">Host a new game from this device</button>
  </div>
</section>

<section id="tv" class="hidden">
  <header><h1 class="logo">NERD NIGHT <span>JEOPARDY</span></h1><div id="tv-turn"></div><div class="muted">Room code <b class="codebig" id="tv-code" style="font-size:clamp(22px,2.6vw,40px)"></b> <span id="tv-conn"></span></div></header>
  <div id="tv-main"></div>
  <div class="scores" id="tv-scores"></div>
</section>

<section id="host" class="hidden">
  <header>
    <h1 class="logo">HOST <span>CONTROLS</span></h1><div><span class="muted">Room code</span> <b class="codebig" id="h-code" style="font-size:30px"></b> <span class="muted" id="h-net" style="font-size:14px">Opening room…</span></div>
    <div class="row">
      <button class="btn sm" id="h-new" type="button">New game</button>
      <button class="btn sm" id="h-final" type="button">Go to Final Jeopardy</button>
    </div>
  </header>
  <div id="h-panel" class="hpanel"></div>
  <div id="h-board"></div>
  <div class="hpanel"><div class="row" style="justify-content:space-between"><b>Players</b><span class="muted" style="font-size:14px">Use the small buttons to fix a score by $200</span></div><div class="plist" id="h-players"></div></div>
</section>

<section id="player" class="hidden">
  <header><h1 class="logo">NERD <span>NIGHT</span></h1><span class="pill" id="p-me"></span></header>
  <p class="muted hidden" id="p-conn" style="text-align:center;margin:0"></p>
  <div id="p-main"></div>
  <div class="scores" id="p-scores"></div>
</section>

const CATS = ["Fantasy & Sci-Fi Books","Star Wars","Video Games","Wilderness Survival","Anime","Deadliest Warrior & Animals"];
const VALUES = [200,400,600,800,1000];
const BANK = {}; BANK_RAW.forEach(r => BANK[r[0]] = {id:r[0], c:r[1], s:r[2], v:r[3], q:r[4], a:r[5], x:r[6]});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let me = null;

const PREFIX = "nnj-live-v2-";

/* ---------- boot ---------- */
(function boot(){
  try{ me = localStorage.getItem("nnj-pid"); if(!me){ me = "p" + Math.random().toString(36).slice(2,10); localStorage.setItem("nnj-pid", me); } }catch(e){ me = "p" + Math.random().toString(36).slice(2,10); }
  const qs = new URLSearchParams(location.search);
  const code = (qs.get("code") || location.hash.replace("#","") || "").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
  if(code) $("code").value = code;
  try{ const saved = localStorage.getItem("nnj-name"); if(saved) $("name").value = saved; }catch(e){}
  if(typeof Peer === "undefined"){ $("status").textContent = "The connection library didn't load. Check your internet connection and reload."; return; }
  $("status").textContent = "Enter the room code on the TV, plus your name. Your phone becomes your buzzer.";
  $("join-card").classList.remove("hidden"); $("roles").classList.remove("hidden");
})();

const peerOpts = { debug: 0, config: { iceServers: [ {urls: "stun:stun.l.google.com:19302"}, {urls: "stun:global.stun.twilio.com:3478"} ] } };

/* ---------- joining (players and TV) ---------- */
let wantRole = null, retryTimer = null;
function connectToHost(asRole){
  wantRole = asRole;
  const code = $("code").value.trim().toUpperCase();
  if(code.length !== 4){ $("status").textContent = "Enter the 4-letter room code shown on the TV."; $("code").focus(); return false; }
  CODE = code;
  if(!peer || peer.destroyed){ peer = new Peer(undefined, peerOpts); peer.on("error", e => { if(e && e.type === "peer-unavailable"){ setStatus("No game found with code " + CODE + ". Check the code on the TV."); } }); }
  const go = () => {
    if(conn){ try{ conn.close(); }catch(e){} }
    conn = peer.connect(PREFIX + CODE, { reliable: true, metadata: { pid: me, role: asRole } });
    conn.on("open", () => { setStatus(""); sendHello(); });
    conn.on("data", onHostMessage);
    conn.on("close", () => { setStatus("Connection lost. Reconnecting…"); scheduleRetry(); });
    conn.on("error", () => scheduleRetry());
  };
  if(peer.open) go(); else peer.once("open", go);
  return true;
}
function scheduleRetry(){ clearTimeout(retryTimer); retryTimer = setTimeout(() => { if(peer && peer.disconnected) try{ peer.reconnect(); }catch(e){} connectToHost(wantRole); }, 2000); }
function setStatus(t){ $("status").textContent = t; const b = $("p-conn"); if(b){ b.textContent = t; b.classList.toggle("hidden", !t); } const tb = $("tv-conn"); if(tb){ tb.textContent = t; } }
function sendHello(){ if(conn && conn.open) conn.send({type:"hello", pid: me, role: wantRole, doc: wantRole === "player" ? myDoc : null}); }
function onHostMessage(m){
  if(!m || typeof m !== "object") return;
  if(m.type === "state"){ G = m.G; P = m.P || {}; if(role === "player" && G && G.scores && !(me in G.scores) && P[me] === undefined){ sendHello(); } render(); }
  if(m.type === "kicked"){ role = null; show("landing"); setStatus("The host removed you from the game."); try{ conn.close(); }catch(e){} }
}

$("btn-join").onclick = () => {
  const name = $("name").value.trim().slice(0,18);
  if(!name){ $("name").focus(); return; }
  try{ localStorage.setItem("nnj-name", name); }catch(e){}
  myDoc = Object.assign({}, myDoc, {name, joinedAt: myDoc.joinedAt || Date.now()});
  if(!connectToHost("player")) return;
  role = "player"; show("player"); $("p-main").innerHTML = `<p class="p-msg">Connecting to room ${esc(CODE)}…</p>`;
};
$("btn-tv").onclick = () => { if(!connectToHost("tv")) return; role = "tv"; show("tv"); $("tv-main").innerHTML = `<div class="stage"><p class="clue">Connecting to room ${esc(CODE)}…</p></div>`; };
$("btn-host").onclick = () => startHosting();

/* ---------- player's own doc ---------- */
let myDoc = {};
async function writeMine(){
  if(conn && conn.open){ try{ conn.send({type:"doc", pid: me, doc: JSON.parse(JSON.stringify(myDoc))}); return true; }catch(e){} }
  return false;
}
function onRoomBuzz(){}

/* ---------- host ---------- */
function newCode(){ const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let c = ""; for(let i=0;i<4;i++) c += L[Math.floor(Math.random()*L.length)]; return c; }
function startHosting(){
  role = "host"; hostLoaded = true; show("host");
  let saved = null; try{ saved = JSON.parse(localStorage.getItem("nnj-host") || "null"); }catch(e){}
  if(saved && saved.G && saved.G.v && saved.G.phase !== "over" && Date.now() - (saved.G.at||0) < 6*3600*1000){ CODE = saved.code; G = saved.G; P = saved.P || {}; }
  else { CODE = newCode(); P = {}; G = null; }
  openHostPeer();
  if(!G) newGame(); else commit();
}
function openHostPeer(){
  $("h-code").textContent = CODE;
  peer = new Peer(PREFIX + CODE, peerOpts);
  peer.on("open", () => { $("h-net").textContent = "Room open"; });
  peer.on("error", e => {
    if(e && e.type === "unavailable-id"){ CODE = newCode(); try{ peer.destroy(); }catch(x){} openHostPeer(); commit(); return; }
    $("h-net").textContent = "Connection trouble: " + (e && e.type || "unknown") + ". Retrying…";
  });
  peer.on("disconnected", () => { $("h-net").textContent = "Reconnecting to the room server…"; setTimeout(() => { try{ peer.reconnect(); }catch(e){} }, 1500); });
  peer.on("connection", c => {
    c.on("open", () => { conns.add(c); try{ c.send(stateMsg()); }catch(e){} });
    c.on("data", m => onClientMessage(c, m));
    c.on("close", () => conns.delete(c));
    c.on("error", () => conns.delete(c));
  });
}
function cleanDoc(d){
  if(!d || typeof d !== "object") return null;
  const o = { name: String(d.name || "Player").slice(0,18), joinedAt: +d.joinedAt || Date.now() };
  if(d.buzz) o.buzz = { t: +d.buzz.t, at: +d.buzz.at };
  if(d.pick) o.pick = { c: +d.pick.c|0, r: +d.pick.r|0, n: +d.pick.n, t: +d.pick.t };
  if(d.dd) o.dd = { n: +d.dd.n, amt: +d.dd.amt||0 };
  if(d.f) o.f = { n: +d.f.n, w: +d.f.w||0, a: d.f.a != null ? String(d.f.a).slice(0,80) : undefined };
  return o;
}
function onClientMessage(c, m){
  if(role !== "host" || !m || typeof m !== "object") return;
  const pid = String(m.pid || (c.metadata && c.metadata.pid) || "").slice(0,24);
  if(!pid) return;
  if(m.type === "hello" && m.role === "player" && m.doc){
    if(removed.has(pid)) removed.delete(pid);
    const d = cleanDoc(m.doc); if(!d) return;
    P[pid] = Object.assign({}, P[pid] || {}, {name: d.name, joinedAt: P[pid] ? P[pid].joinedAt : d.joinedAt});
    c.pid = pid; onPlayersForHost(); broadcast(); return;
  }
  if(m.type === "hello"){ try{ c.send(stateMsg()); }catch(e){} return; }
  if(m.type === "doc"){
    if(removed.has(pid)) return;
    const d = cleanDoc(m.doc); if(!d) return;
    if(!P[pid]) d.joinedAt = Date.now();
    P[pid] = d; c.pid = pid;
    onPlayersForHost(); broadcast();
  }
}
const removed = new Set();
function publicP(){
  const out = {}; const showF = G && (G.phase === "freveal" || G.phase === "over");
  for(const [id,p] of Object.entries(P)){ out[id] = { name: p.name, joinedAt: p.joinedAt }; if(showF && p.f) out[id].f = p.f; }
  return out;
}
function stateMsg(){ return { type: "state", G, P: publicP() }; }
let bTimer = null;
function broadcast(){
  if(role !== "host") return;
  clearTimeout(bTimer);
  bTimer = setTimeout(() => {
    const m = stateMsg();
    for(const c of conns){ try{ if(c.open) c.send(m); }catch(e){} }
    try{ localStorage.setItem("nnj-host", JSON.stringify({code: CODE, G, P})); }catch(e){}
  }, 15);
}
function pushG(){ broadcast(); }
function commit(){ G.at = Date.now(); render(); pushG(); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildBoard(){
  const used = new Set(); const board = [];
  for(let c=0;c<6;c++){
    const col = [];
    for(const v of VALUES){
      const pool = shuffle(BANK_RAW.filter(r => r[1]===c && r[3]===v && !used.has(r[5].toLowerCase())));
      const pick = pool[0]; used.add(pick[5].toLowerCase());
      col.push({id: pick[0], used:false, dd:false});
    }
    board.push(col);
  }
  const c = Math.floor(Math.random()*6), r = 1 + Math.floor(Math.random()*4);
  board[c][r].dd = true;
  const finals = BANK_RAW.filter(x => x[3]===1000 && !board.some(col => col.some(t => t.id===x[0])));
  return {board, finalId: shuffle(finals)[0][0]};
}
function newGame(keepScores){
  const {board, finalId} = buildBoard();
  const ids = Object.keys(P);
  G = { v:2, phase:"lobby", board, finalId, pickT:Date.now(), cur:null, buzzOpen:false, token:Date.now(), winner:null, locked:[], scores:{}, picker: ids.length ? ids[Math.floor(Math.random()*ids.length)] : null,
        ddN:0, ddWager:0, fN:0, fDone:{}, at:Date.now() };
  ids.forEach(id => G.scores[id] = 0);
  commit();
}
const lastPick = {}, lastDD = {};
function onPlayersForHost(){
  if(role !== "host" || !G) return;
  let changed = false;
  for(const id of Object.keys(P)){ if(!(id in G.scores)){ G.scores[id] = 0; changed = true; } }
  if(!G.picker && Object.keys(P).length){ G.picker = Object.keys(P)[0]; changed = true; }
  // tile pick from the picker's phone
  const pp = G.picker && P[G.picker];
  if(G.phase === "board" && pp && pp.pick && pp.pick.t === G.pickT && pp.pick.n !== lastPick[G.picker]){
    lastPick[G.picker] = pp.pick.n;
    const t = G.board[pp.pick.c] && G.board[pp.pick.c][pp.pick.r];
    if(t && !t.used){ openTile(pp.pick.c, pp.pick.r); return; }
  }
  // daily double wager
  if(G.phase === "dd" && pp && pp.dd && pp.dd.n === G.ddN && lastDD[G.ddN] !== true){
    lastDD[G.ddN] = true; G.ddWager = clampWager(G.picker, pp.dd.amt); G.phase = "ddclue"; changed = true;
  }
  // buzzes through the database
  if(G.phase === "clue" && G.buzzOpen && !G.winner){
    const cands = Object.entries(P).filter(([id,p]) => p.buzz && p.buzz.t === G.token && !G.locked.includes(id)).sort((a,b) => a[1].buzz.at - b[1].buzz.at);
    if(cands.length){ awardBuzz(cands[0][0]); return; }
  }
  if(changed) commit(); else render();
}
function onRoomBuzz(data){
  if(role !== "host" || !G || !data) return;
  if(G.phase === "clue" && G.buzzOpen && !G.winner && data.t === G.token && P[data.id] && !G.locked.includes(data.id)) awardBuzz(data.id);
}
function awardBuzz(id){ G.winner = id; G.buzzOpen = false; commit(); }
function clampWager(id, amt){ const max = Math.max(G.scores[id]||0, 1000); amt = Math.round(+amt || 0); return Math.min(Math.max(amt, 5), max); }
function openTile(c, r){
  const t = G.board[c][r]; G.cur = {c, r}; G.winner = null; G.locked = []; G.buzzOpen = false; G.token++;
  if(t.dd){ G.phase = "dd"; G.ddN = Date.now(); G.ddWager = 0; }
  else { G.phase = "clue"; G.openAt = Date.now() + 2500; }
  commit();
  if(!t.dd) setTimeout(() => { if(G.phase === "clue" && G.cur && G.cur.c===c && G.cur.r===r && !G.buzzOpen && !G.winner){ openBuzzers(); } }, 2500);
}
function openBuzzers(){ G.buzzOpen = true; G.winner = null; G.token++; commit(); }
function curVal(){ return VALUES[G.cur.r]; }
function judge(right){
  if(G.phase === "ddclue"){
    G.scores[G.picker] = (G.scores[G.picker]||0) + (right ? G.ddWager : -G.ddWager);
    G.phase = "reveal"; G.lastRight = right ? G.picker : null; commit(); return;
  }
  const id = G.winner; if(!id) return;
  if(right){ G.scores[id] = (G.scores[id]||0) + curVal(); G.picker = id; G.phase = "reveal"; G.lastRight = id; commit(); }
  else {
    G.scores[id] = (G.scores[id]||0) - curVal(); G.locked.push(id); G.winner = null;
    const left = Object.keys(P).filter(x => !G.locked.includes(x));
    if(!left.length){ G.phase = "reveal"; G.lastRight = null; commit(); }
    else { G.buzzOpen = true; G.token++; commit(); }
  }
}
function revealNow(){ G.phase = "reveal"; G.buzzOpen = false; G.lastRight = null; commit(); }
function backToBoard(){
  if(G.cur){ G.board[G.cur.c][G.cur.r].used = true; }
  G.cur = null; G.winner = null; G.buzzOpen = false; G.locked = [];
  if(G.board.every(col => col.every(t => t.used))){ toFinal(); return; }
  G.phase = "board"; G.pickT = Date.now();
  commit();
}
function toFinal(){ G.phase = "fcat"; G.cur = null; G.winner = null; G.buzzOpen = false; G.fDone = {}; G.fN = Date.now(); commit(); }
function fNext(){
  if(G.phase === "fcat"){ G.phase = "fclue"; G.fStart = Date.now(); commit(); }
  else if(G.phase === "fclue"){ G.phase = "freveal"; commit(); }
  else if(G.phase === "freveal"){ G.phase = "over"; commit(); }
}
function fJudge(id, right){
  const p = P[id]; const w = (p && p.f && p.f.n === G.fN) ? clampF(id, p.f.w) : 0;
  G.scores[id] = (G.scores[id]||0) + (right ? w : -w); G.fDone[id] = right ? "right" : "wrong"; commit();
}
function clampF(id, w){ return Math.min(Math.max(Math.round(+w||0),0), Math.max(G.scores[id]||0,0)); }
function adjust(id, d){ G.scores[id] = (G.scores[id]||0) + d; commit(); }

$("h-new").onclick = () => { const b = $("h-new"); if(b.dataset.armed){ delete b.dataset.armed; b.textContent = "New game"; newGame(); } else { b.dataset.armed = "1"; b.textContent = "Tap again for a new board"; setTimeout(() => { delete b.dataset.armed; b.textContent = "New game"; }, 3000); } };
$("h-final").onclick = () => toFinal();
document.addEventListener("keydown", e => {
  if(role !== "host" || !G || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.code === "KeyB" && G.phase === "clue" && !G.buzzOpen && !G.winner) openBuzzers();
  if(e.code === "KeyY" && (G.winner || G.phase === "ddclue")) judge(true);
  if(e.code === "KeyN" && (G.winner || G.phase === "ddclue")) judge(false);
  if(e.code === "Space" && G.phase === "reveal"){ e.preventDefault(); backToBoard(); }
});

/* ---------- rendering ---------- */
const nameOf = id => (P[id] && P[id].name) || "Player";
function scoreStrip(host){
  const ids = Object.keys(G ? G.scores : {}).filter(id => P[id]).sort((a,b) => (G.scores[b]||0)-(G.scores[a]||0));
  host.innerHTML = ids.map(id => `<div class="sc${(G.scores[id]||0)<0?" neg":""}${G.picker===id?" pick":""}${id===me&&role==="player"?" you":""}"><span class="n">${esc(nameOf(id))}</span><span class="p">${money(G.scores[id]||0)}</span></div>`).join("") || `<span class="muted">No players yet. Everyone opens this page on their phone and enters the room code.</span>`;
}
function boardHTML(clickable){
  let h = CATS.map(c => `<div class="cat">${esc(c)}</div>`).join("");
  for(let r=0;r<5;r++) for(let c=0;c<6;c++){ const t = G.board[c][r]; h += `<button class="tile${t.used?" used":""}" type="button" data-c="${c}" data-r="${r}" ${t.used||!clickable?"disabled":""} aria-label="${esc(CATS[c])} for $${VALUES[r]}">${t.used?"":"$"+VALUES[r]}</button>`; }
  return `<div class="board">${h}</div>`;
}
function curClue(){ return G && G.cur ? BANK[G.board[G.cur.c][G.cur.r].id] : null; }
function render(){
  if(!G && role){ if(role === "tv"){ $("tv-main").innerHTML = `<div class="stage"><p class="clue">Waiting for the host to start a game</p></div>`; } if(role==="player"){ $("p-main").innerHTML = `<p class="p-msg">You're in. Waiting for the host.</p>`; } return; }
  if(role === "tv") renderTV(); else if(role === "host") renderHost(); else if(role === "player") renderPlayer();
}

function stageFor(view){
  const q = curClue(), ph = G.phase;
  if(ph === "lobby"){
    const names = Object.keys(P).map(id => esc(nameOf(id))).join(" · ") || "Nobody yet";
    return `<div class="stage"><div class="top">Open this page on your phone and enter room code <b>${esc(CODE)}</b></div><p class="clue">Players: ${names}</p></div>`;
  }
  if(ph === "dd"){ return `<div class="stage dd-splash"><p class="who">DAILY<br>DOUBLE</p><div class="top" style="color:#ffe">${esc(nameOf(G.picker))} is placing a wager</div></div>`; }
  if(["clue","ddclue","reveal"].includes(ph) && q){
    const top = `<div class="top">${esc(CATS[G.cur.c])} · ${esc(q.s)} · <b>${ph==="ddclue"||(ph==="reveal"&&G.board[G.cur.c][G.cur.r].dd) ? "Daily Double "+money(G.ddWager) : "$"+VALUES[G.cur.r]}</b></div>`;
    let mid = `<p class="clue">${esc(q.q)}</p>`;
    if(ph === "reveal") mid += `<p class="ans">${esc(q.a)}</p>` + (G.lastRight ? `<div class="top">${esc(nameOf(G.lastRight))} got it</div>` : "");
    else if(ph === "ddclue") mid += `<div class="top">${esc(nameOf(G.picker))}, what's your answer?</div>`;
    else if(G.winner) mid += `<p class="who">${esc(nameOf(G.winner))}</p>`;
    else mid += `<div class="light${G.buzzOpen?" on":""}"><i></i>${G.buzzOpen ? "Buzzers open" : "Buzzers open in a moment"}</div>`;
    if(G.locked && G.locked.length && ph === "clue") mid += `<div class="top">Locked out: ${G.locked.map(id => esc(nameOf(id))).join(", ")}</div>`;
    return `<div class="stage">${top}${mid}</div>`;
  }
  const f = BANK[G.finalId];
  if(ph === "fcat") return `<div class="stage"><div class="top">Final Jeopardy</div><p class="clue">${esc(CATS[f.c])}</p><div class="top">Lock in your wager on your phone</div></div>`;
  if(ph === "fclue"){ const left = Math.max(0, 30 - Math.floor((Date.now() - G.fStart)/1000)); return `<div class="stage"><div class="top">Final Jeopardy · ${esc(CATS[f.c])}</div><p class="clue">${esc(f.q)}</p><div class="top"><b>${left}</b> seconds. Type your answer on your phone.</div></div>`; }
  if(ph === "freveal" || ph === "over"){
    const rows = Object.keys(P).map(id => { const p = P[id], a = p.f && p.f.n === G.fN ? p.f : {}; const st = G.fDone[id]; return `<div class="top">${esc(nameOf(id))}: <b>${esc(a.a || "no answer")}</b> ${st ? (st==="right"?"✓":"✗")+" "+money(clampF(id,a.w||0)) : ""}</div>`; }).join("");
    let extra = "";
    if(ph === "over"){ const top = Object.keys(G.scores).filter(id=>P[id]).sort((a,b)=>G.scores[b]-G.scores[a])[0]; extra = top ? `<p class="who">${esc(nameOf(top))} wins</p>` : ""; }
    return `<div class="stage"><div class="top">Final Jeopardy · ${esc(CATS[f.c])}</div><p class="ans">${esc(f.a)}</p>${rows}${extra}</div>`;
  }
  return null;
}

function renderTV(){
  $("tv-code").textContent = CODE;
  $("tv-turn").textContent = G.phase === "board" && G.picker ? `${nameOf(G.picker)} picks` : "";
  const st = G.phase === "board" ? null : stageFor("tv");
  $("tv-main").innerHTML = st || boardHTML(false);
  scoreStrip($("tv-scores"));
}

function renderHost(){
  const q = curClue(), ph = G.phase; let h = "";
  if(ph === "lobby"){
    h = `<div class="row" style="justify-content:space-between"><div><b>Lobby.</b> <span class="muted">${Object.keys(P).length} joined. Players open this page on their phones and enter code ${esc(CODE)}. On the TV, open this page, enter the code, and tap Show the TV board.</span></div><button class="btn primary" id="h-start" type="button">Start the game</button></div>`;
  } else if(ph === "board"){
    h = `<div class="row" style="justify-content:space-between"><div><b>${esc(nameOf(G.picker))}</b> picks a tile on their phone. <span class="muted">You can also tap a tile below.</span></div><span class="muted">Daily Double is hidden on this board</span></div>`;
  } else if(ph === "dd"){
    h = `<div><b>Daily Double.</b> ${esc(nameOf(G.picker))} is entering a wager on their phone (max ${money(Math.max(G.scores[G.picker]||0,1000))}).</div><div class="row"><label for="h-ddw">Or enter it here</label><input id="h-ddw" class="txt-in" style="width:140px" type="number" min="5" step="100"><button class="btn primary" id="h-ddgo" type="button">Lock wager</button></div>`;
  } else if((ph === "clue" || ph === "ddclue" || ph === "reveal") && q){
    h = `<div class="muted">${esc(CATS[G.cur.c])} · ${esc(q.s)} · ${ph==="ddclue" ? "Daily Double "+money(G.ddWager)+" for "+esc(nameOf(G.picker)) : "$"+VALUES[G.cur.r]}</div><p class="clue">${esc(q.q)}</p><div class="secret">Answer (host only): ${esc(q.a)}${q.x ? `<span class="muted"> · also accept: ${esc(q.x)}</span>` : ""}</div>`;
    if(ph === "clue"){
      if(G.winner) h += `<div class="row"><b style="font-size:22px">${esc(nameOf(G.winner))} buzzed.</b><button class="btn good" id="h-y" type="button">Correct (Y)</button><button class="btn bad" id="h-n" type="button">Wrong (N)</button></div>`;
      else h += `<div class="row">${G.buzzOpen ? `<span class="light on"><i></i>Buzzers open</span>` : `<button class="btn primary" id="h-open" type="button">Open buzzers now (B)</button>`}<button class="btn" id="h-rev" type="button">Nobody got it, show answer</button></div>`;
    } else if(ph === "ddclue"){
      h += `<div class="row"><button class="btn good" id="h-y" type="button">Correct (Y)</button><button class="btn bad" id="h-n" type="button">Wrong (N)</button></div>`;
    } else {
      h += `<div class="row"><button class="btn primary" id="h-back" type="button">Back to the board (Space)</button></div>`;
    }
  } else if(ph === "fcat" || ph === "fclue" || ph === "freveal" || ph === "over"){
    const f = BANK[G.finalId];
    h = `<div class="muted">Final Jeopardy · ${esc(CATS[f.c])}</div><p class="clue">${esc(f.q)}</p><div class="secret">Answer: ${esc(f.a)}${f.x ? ` · also accept: ${esc(f.x)}` : ""}</div>`;
    const ws = Object.keys(P).map(id => { const p = P[id], a = p.f && p.f.n === G.fN ? p.f : null; const done = G.fDone[id];
      return `<div class="prow"><span class="nm">${esc(nameOf(id))}</span><span class="fa">${ph==="fcat" ? (a && a.w!=null ? "wager locked" : "wagering…") : esc(a && a.a ? a.a : "no answer yet")} ${a && ph!=="fcat" ? "· "+money(clampF(id,a.w||0)) : ""}</span>${ph==="freveal" && !done ? `<button class="btn good sm" data-fj="${id}" data-r="1" type="button">Right</button><button class="btn bad sm" data-fj="${id}" data-r="0" type="button">Wrong</button>` : (done ? `<span class="pill">${done}</span>` : "")}</div>`; }).join("");
    h += `<div class="plist">${ws}</div><div class="row">${ph==="fcat" ? `<button class="btn primary" id="h-fn" type="button">Show the clue</button>` : ph==="fclue" ? `<button class="btn primary" id="h-fn" type="button">Reveal answers</button>` : ph==="freveal" ? `<button class="btn primary" id="h-fn" type="button">Finish the game</button>` : `<button class="btn primary" id="h-again" type="button">Play again with a new board</button>`}</div>`;
  }
  const keepDD = $("h-ddw") ? $("h-ddw").value : "";
  $("h-panel").innerHTML = h;
  if($("h-ddw")) $("h-ddw").value = keepDD;
  $("h-board").innerHTML = (ph === "board" || ph === "lobby") ? boardHTML(ph === "board") : "";
  $("h-players").innerHTML = Object.keys(P).map(id => `<div class="prow"><span class="nm">${esc(nameOf(id))}${G.picker===id?' <span class="pill">picking</span>':""}</span><button class="btn sm" data-adj="${id}" data-d="-200" type="button">−200</button><span class="pt">${money(G.scores[id]||0)}</span><button class="btn sm" data-adj="${id}" data-d="200" type="button">+200</button><button class="btn sm" data-pk="${id}" type="button">Give pick</button><button class="btn sm" data-rm="${id}" type="button">Remove</button></div>`).join("") || `<span class="muted">Nobody has joined yet.</span>`;
  const on = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  on("h-start", () => { const ids = Object.keys(P); if((!G.picker || !P[G.picker]) && ids.length) G.picker = ids[Math.floor(Math.random()*ids.length)]; G.phase = "board"; G.pickT = Date.now(); commit(); });
  on("h-open", openBuzzers); on("h-y", () => judge(true)); on("h-n", () => judge(false)); on("h-rev", revealNow); on("h-back", backToBoard);
  on("h-fn", fNext); on("h-again", () => newGame());
  on("h-ddgo", () => { const v = $("h-ddw").value; if(v === "") return; G.ddWager = clampWager(G.picker, v); G.phase = "ddclue"; commit(); });
  document.querySelectorAll("#h-board .tile").forEach(b => b.onclick = () => openTile(+b.dataset.c, +b.dataset.r));
  document.querySelectorAll("[data-adj]").forEach(b => b.onclick = () => adjust(b.dataset.adj, +b.dataset.d));
  document.querySelectorAll("[data-pk]").forEach(b => b.onclick = () => { G.picker = b.dataset.pk; G.pickT = Date.now(); commit(); });
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { const id = b.dataset.rm; if(!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Tap to confirm"; return; } delete G.scores[id]; if(G.picker === id) G.picker = Object.keys(P).find(x => x !== id) || null; delete P[id]; removed.add(id); for(const c of conns){ if(c.pid === id){ try{ c.send({type:"kicked"}); }catch(e){} } } commit(); });
  document.querySelectorAll("[data-fj]").forEach(b => b.onclick = () => fJudge(b.dataset.fj, b.dataset.r === "1"));
}

let pKey = "";
function renderPlayer(){
  $("p-me").textContent = (P[me] && P[me].name) || "";
  scoreStrip($("p-scores"));
  const ph = G.phase, q = curClue(), mine = myDoc;
  let h = "", key = ph + "|" + (G.cur ? G.cur.c+"-"+G.cur.r : "") + "|" + G.token + "|" + G.buzzOpen + "|" + G.winner + "|" + (G.locked||[]).join(",") + "|" + G.picker + "|" + G.fN + "|" + JSON.stringify(G.board.map(c=>c.map(t=>t.used?1:0))) + "|" + JSON.stringify(G.fDone||{}) + "|" + G.ddWager;
  if(key === pKey && ph !== "fclue") return; // keep inputs intact
  pKey = key;
  if(ph === "lobby") h = `<p class="p-msg">You're in.<br>Waiting for the host to start.</p>`;
  else if(ph === "board"){
    if(G.picker === me){
      let g = CATS.map(c => `<div class="cat">${esc(c)}</div>`).join("");
      for(let r=0;r<5;r++) for(let c=0;c<6;c++){ const t = G.board[c][r]; g += `<button class="tile${t.used?" used":""}" type="button" data-c="${c}" data-r="${r}" ${t.used?"disabled":""}>${t.used?"":VALUES[r]}</button>`; }
      h = `<p class="p-msg">Your pick</p><div class="pgrid">${g}</div>`;
    } else h = `<p class="p-msg">${esc(nameOf(G.picker))} is picking</p>`;
  }
  else if(ph === "dd"){
    if(G.picker === me) h = `<p class="p-msg">Daily Double!</p><p class="p-clue">${esc(CATS[G.cur.c])}. Wager up to ${money(Math.max(G.scores[me]||0,1000))}.</p><input id="p-ddw" class="big-in" type="number" inputmode="numeric" min="5" step="100" value="${Math.min(1000, Math.max(G.scores[me]||0,1000))}"><button class="btn primary" id="p-ddgo" type="button">Lock it in</button>`;
    else h = `<p class="p-msg">Daily Double.<br>${esc(nameOf(G.picker))} is wagering.</p>`;
  }
  else if((ph === "clue" || ph === "ddclue") && q){
    const locked = (G.locked||[]).includes(me);
    if(ph === "ddclue") h = `<p class="p-clue">${esc(q.q)}</p><p class="p-msg">${G.picker===me ? "Say your answer out loud" : esc(nameOf(G.picker))+" is answering"}</p>`;
    else {
      const won = G.winner === me;
      const label = won ? "YOU'RE UP" : G.winner ? esc(nameOf(G.winner)) : locked ? "LOCKED" : G.buzzOpen ? "BUZZ" : "WAIT";
      h = `<p class="p-clue">${esc(q.q)}</p><button id="buzz" class="${won?"won":""}" type="button" ${(!G.buzzOpen || locked || G.winner) ? "disabled" : ""}>${label}</button>${won ? `<p class="p-msg">Say your answer out loud</p>` : ""}`;
    }
  }
  else if(ph === "reveal" && q) h = `<p class="p-clue">${esc(q.q)}</p><p class="p-msg" style="color:var(--brass)">${esc(q.a)}</p>${G.lastRight ? `<p class="p-msg" style="font-size:20px">${G.lastRight===me ? "You got it! You pick next." : esc(nameOf(G.lastRight))+" got it"}</p>` : ""}`;
  else if(ph === "fcat"){
    const f = BANK[G.finalId], mx = Math.max(G.scores[me]||0, 0), a = mine.f && mine.f.n === G.fN ? mine.f : null;
    h = `<p class="p-msg">Final Jeopardy</p><p class="p-clue">${esc(CATS[f.c])}</p>` + (mx <= 0 ? `<p class="p-msg" style="font-size:20px">You need money in the bank to wager. You can still answer.</p>` : `<label for="p-fw" class="muted">Wager, up to ${money(mx)}</label><input id="p-fw" class="big-in" type="number" inputmode="numeric" min="0" max="${mx}" step="100" value="${a && a.w != null ? a.w : 0}"><button class="btn primary" id="p-fwgo" type="button">${a && a.w != null ? "Update wager" : "Lock wager"}</button>${a && a.w != null ? `<p class="muted" style="text-align:center">Locked at ${money(a.w)}</p>` : ""}`);
  }
  else if(ph === "fclue"){
    const f = BANK[G.finalId], a = mine.f && mine.f.n === G.fN ? mine.f : {}; const left = Math.max(0, 30 - Math.floor((Date.now() - G.fStart)/1000));
    if(!$("p-fa")){ h = `<p class="p-clue">${esc(f.q)}</p><label for="p-fa" class="muted">Your answer</label><input id="p-fa" class="txt-in" autocomplete="off" value="${esc(a.a||"")}"><button class="btn primary" id="p-fago" type="button">Send answer</button><p class="muted" id="p-fleft" style="text-align:center">${left} seconds left</p>`; }
    else { $("p-fleft").textContent = left + " seconds left"; return; }
  }
  else if(ph === "freveal" || ph === "over"){
    const f = BANK[G.finalId]; const st = G.fDone[me];
    h = `<p class="p-msg" style="color:var(--brass)">${esc(f.a)}</p>${st ? `<p class="p-msg">${st === "right" ? "You got it!" : "Not this time"}</p>` : `<p class="p-msg" style="font-size:20px">The host is checking answers</p>`}`;
    if(ph === "over"){ const top = Object.keys(G.scores).filter(id=>P[id]).sort((a,b)=>G.scores[b]-G.scores[a])[0]; if(top) h += `<p class="p-msg">${top===me ? "You win!" : esc(nameOf(top))+" wins"}</p>`; }
  }
  $("p-main").innerHTML = h;
  document.querySelectorAll("#p-main .tile").forEach(b => b.onclick = () => { myDoc = Object.assign({}, myDoc, {pick:{c:+b.dataset.c, r:+b.dataset.r, n:Date.now(), t:G.pickT}}); writeMine(); b.disabled = true; });
  const bz = $("buzz"); if(bz) bz.onclick = buzz;
  const dd = $("p-ddgo"); if(dd) dd.onclick = () => { myDoc = Object.assign({}, myDoc, {dd:{n:G.ddN, amt:+$("p-ddw").value||0}}); writeMine(); dd.disabled = true; dd.textContent = "Locked"; };
  const fw = $("p-fwgo"); if(fw) fw.onclick = () => { const mx = Math.max(G.scores[me]||0,0); const w = Math.min(Math.max(Math.round(+$("p-fw").value||0),0),mx); const prev = (myDoc.f&&myDoc.f.n===G.fN)?myDoc.f:{}; myDoc = Object.assign({}, myDoc, {f:Object.assign({}, prev, {n:G.fN, w})}); writeMine(); fw.textContent = "Locked at " + money(w); };
  const fa = $("p-fago"); if(fa) fa.onclick = () => { const prev = (myDoc.f&&myDoc.f.n===G.fN)?myDoc.f:{w:0}; myDoc = Object.assign({}, myDoc, {f:Object.assign({}, prev, {n:G.fN, a:$("p-fa").value.trim().slice(0,80)})}); writeMine(); fa.textContent = "Sent. Tap again to change it."; };
}
function buzz(){
  if(!G || !G.buzzOpen || G.winner || (G.locked||[]).includes(me)) return;
  const b = $("buzz"); if(b){ b.disabled = true; b.textContent = "…"; }
  try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
  myDoc = Object.assign({}, myDoc, {buzz:{t:G.token, at:Date.now()}}); writeMine();
}
// Final Jeopardy countdown refresh
setInterval(() => { if(G && G.phase === "fclue"){ if(role === "player") renderPlayer(); else if(role === "tv") renderTV(); } }, 1000);
</script>

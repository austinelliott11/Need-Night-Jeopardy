<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>St. Jeezy Jeopardy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%230b1116%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-size=%2238%22 text-anchor=%22middle%22 fill=%22%23d9a441%22 font-family=%22Impact,sans-serif%22%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Stencil+Display:wght@800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Gunmetal war room, brass values, blood-red buzzer. Phone-first, portrait. One phone hosts and plays. */
  --bg:#0b1116; --board:#14212b; --tile:#1b2d3a; --tile-hi:#24404f; --line:#22384a;
  --brass:#d9a441; --ink:#eef1ea; --mute:#8a9ca6; --blood:#c0302a; --good:#3f9b5f;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --stencil:"Big Shoulders Stencil Display","Big Shoulders Display",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;overscroll-behavior:none;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
input{font-family:inherit;font-size:18px}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.logo{font-family:var(--stencil);letter-spacing:.06em;color:var(--brass);margin:0;line-height:1}
.logo span{color:var(--ink)}
.btn{background:transparent;color:var(--ink);border:1px solid #3a5263;border-radius:10px;padding:12px 16px;font-size:17px;font-weight:700;min-height:46px}
.btn.primary{background:var(--brass);color:#1a1206;border-color:var(--brass)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:#7a2a25;border-color:#93332d;color:#fff}
.btn.sm{padding:8px 12px;font-size:15px;min-height:38px}
.btn.wide{width:100%}
@media (hover:hover){ .btn:hover:not(:disabled){border-color:var(--brass)} .btn.primary:hover:not(:disabled){background:#e8b85a} }
.muted{color:var(--mute)}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#0b1116;background:#3a5263;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codechip{font-family:var(--stencil);color:var(--brass);letter-spacing:.14em;font-size:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
header.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
header.top .logo{font-size:22px}

/* Landing */
#landing .hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
#landing .logo{font-size:clamp(44px,13vw,76px);text-align:center}
.card{background:var(--board);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card label{color:var(--mute);font-size:15px}
.card input[type=text]{font-size:22px;padding:12px;border-radius:10px;border:1px solid #3a5263;background:#0f1a22;color:var(--ink);text-align:center;width:100%}
#code{letter-spacing:.35em;text-transform:uppercase;font-family:var(--display);font-weight:800;font-size:32px!important}
#status{text-align:center;margin:0;min-height:1.3em}
.or{text-align:center;color:var(--mute);font-size:14px}

/* Game */
#conn{margin:0;text-align:center;font-size:14px;color:#ffd27a;background:#3a2c12;border-radius:8px;padding:6px}
#main{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center;min-height:0}
.msg{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:28px;text-align:center;line-height:1.05;text-wrap:balance;margin:0}
.msg.small{font-size:21px}
.meta{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-size:16px;text-align:center}
.meta b{color:var(--brass)}
.cluebox{background:var(--board);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.clue{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(24px,7vw,34px);line-height:1.1;text-wrap:balance;margin:0}
.ans{font-weight:700;font-size:24px;color:var(--brass);margin:0}
.ans small{display:block;color:var(--mute);font-size:15px;font-weight:600}
.who{font-family:var(--stencil);font-size:clamp(40px,13vw,72px);line-height:1;margin:0;text-align:center}
.splash{border-radius:14px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.splash.dd{background:var(--blood)}
.splash.dd .who{color:#fff6e8}
.splash.dj{background:var(--board)}
.splash.dj .who{color:var(--brass)}
.bigcode{font-family:var(--stencil);color:var(--brass);letter-spacing:.14em;font-size:clamp(64px,22vw,120px);line-height:1;text-align:center;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{padding:5px 10px;border-radius:99px;background:#0f1a22;border:1px solid var(--line);font-weight:700;border-left:5px solid var(--c)}
.settings{display:flex;flex-direction:column;gap:12px;background:#0f1a22;border-radius:12px;padding:14px}
.settings label{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.3}
.settings input{margin-top:3px;width:22px;height:22px;flex:none}

/* Board */
.board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto repeat(5,1fr);gap:3px;background:var(--board);padding:3px;border-radius:10px;height:min(56dvh,460px)}
.cat{background:#0f1a22;border-bottom:2px solid var(--brass);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 2px;min-height:52px;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(9px,2.6vw,13px);line-height:1.05;letter-spacing:.02em;overflow-wrap:anywhere}
.tile{background:var(--tile);border:0;border-radius:4px;color:var(--brass);font-family:var(--display);font-weight:900;font-size:clamp(14px,4.6vw,24px);font-variant-numeric:tabular-nums;padding:0}
.tile:disabled{opacity:1;cursor:default}
.tile.used{background:#101a21;color:transparent}
.board.mine .tile:not(.used){box-shadow:inset 0 0 0 1px #3a5263}
.board.mine .tile:not(.used):active{background:var(--tile-hi)}

/* Buzzer */
#buzz{width:min(78vw,300px);aspect-ratio:1/1;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#e5463e,#9e1f19 70%);color:#fff;font-family:var(--stencil);font-size:clamp(40px,13vw,64px);letter-spacing:.06em;box-shadow:0 10px 0 #5e120e,0 14px 30px rgba(0,0,0,.6);margin:6px auto;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#buzz:active{transform:translateY(6px);box-shadow:0 4px 0 #5e120e}
#buzz.wait{background:radial-gradient(circle at 40% 35%,#3a4b58,#1f2b34 70%);box-shadow:0 10px 0 #121a20;color:#8a9ca6}
#buzz.early{background:radial-gradient(circle at 40% 35%,#6a5a3a,#3a2f1c 70%);color:#ffd27a}
#buzz.off{background:#26333d;box-shadow:0 10px 0 #18222a;color:#5d7080;pointer-events:none}
#buzz.sent{background:radial-gradient(circle at 40% 35%,#b23a33,#6e1712 70%)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge .btn{padding:18px 8px;font-size:20px}
.big-in{font-family:var(--display);font-weight:800;font-size:34px!important;padding:10px;border-radius:10px;border:0;text-align:center;width:100%}
.txt-in{font-size:20px!important;padding:14px;border-radius:10px;border:1px solid #3a5263;background:#0f1a22;color:var(--ink);width:100%}

/* Final list */
.flist{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:6px;background:#0f1a22;border-left:5px solid var(--c,#3a5263);border-radius:10px;padding:10px 8px}
.frow .nm{font-weight:700;color:var(--c)}
.frow .fa{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.frow .btn.sm{padding:8px 9px;flex:none}

/* Scores */
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.sc{background:#101a21;border:1px solid var(--line);border-top:4px solid var(--c,#3a5263);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;min-width:0}
.sc .n{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--c,var(--mute));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .p{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.05}
.sc.neg .p{color:#ff6b62}
.sc.pick{box-shadow:0 0 0 2px var(--brass) inset}
.sc.you{background:#17293a}

/* Host controls */
#hostbar{display:flex;flex-direction:column;gap:6px;background:#101a21;border:1px dashed #5a4a26;border-radius:12px;padding:8px}
#hostbar .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b99248}
#hostbar .row .btn{flex:1}
.sheet{position:fixed;inset:0;background:rgba(5,9,12,.86);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .inner{background:var(--board);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:6px;background:#0f1a22;border-left:5px solid var(--c);border-radius:10px;padding:8px;flex-wrap:wrap}
.prow .nm{font-weight:700;flex:1;min-width:30%}
.prow .pt{font-family:var(--display);font-weight:900;font-size:20px;min-width:70px;text-align:right}

/* profile + pace */
.mebtn{border:0;cursor:pointer;font-family:var(--body)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{aspect-ratio:1/1;border-radius:12px;border:3px solid transparent;background:var(--c);color:#0b1116;font-size:22px;font-weight:900;min-height:44px}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.sw.taken{background:#05080a;color:#3a4b58;border-color:#1b2730;opacity:1}
.pace{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;border:1px solid #3a5263;border-radius:10px;overflow:hidden}
.seg button{flex:1;background:transparent;color:var(--ink);border:0;padding:10px 6px;font-weight:700;font-size:16px}
.seg button+button{border-left:1px solid #3a5263}
.seg button.on{background:var(--brass);color:#1a1206}
/* answer box + timers */
#ansbox{background:var(--board);border:2px solid var(--brass);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
#ans-clue{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:17px;line-height:1.15;text-align:center}
.ansrow{display:flex;gap:8px}
#ans-in{flex:1;min-width:0;font-size:20px;padding:12px;border-radius:10px;border:1px solid #3a5263;background:#0f1a22;color:var(--ink)}
#ans-hint{margin:0;font-size:14px;text-align:center}
.tbar{height:8px;background:#0f1a22;border-radius:99px;overflow:hidden;width:100%}
.tbar i{display:block;height:100%;width:100%;background:var(--brass);transition:width .2s linear;border-radius:99px}
.tbar i.low{background:var(--blood)}
.tbar.tv{height:1.2vh;min-height:8px;max-width:70vw;margin:0 auto}
.frow b.right{color:var(--good)} .frow b.wrong{color:#ff6b62}
.judgebox{display:flex;flex-direction:column;align-items:center;gap:1.4vh}
.judgebox .said{margin:0;font-family:var(--body);font-weight:700;font-size:clamp(28px,3.6vw,64px);color:var(--ink);text-align:center}
.btn.big{font-size:clamp(18px,1.8vw,30px);padding:1.4vh 2.4vw}
.hint{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:700;font-size:clamp(13px,1.2vw,20px);white-space:nowrap}
.hint.right{background:#1f4a2d;color:#9de3b1} .hint.maybe{background:#4a3c12;color:#ffd27a} .hint.wrong{background:#4a1d1a;color:#ff9a92}
.btn.on{outline:3px solid #fff;outline-offset:1px}
.pt-in{width:110px;font-family:var(--display);font-weight:900;font-size:20px;padding:6px 8px;border-radius:8px;border:1px solid #3a5263;background:#0b1116;color:var(--ink);text-align:right}
#tv-scores .sc{cursor:pointer}
/* ===== Shared screen (laptop / TV) ===== */
#tv{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:1.2vh;padding:2vh 2.2vw;overflow:hidden}
.tv-top{grid-row:1}
#tv-net{grid-row:2}
#tv-main{grid-row:3}
#tv-ctrl{grid-row:4}
#tv-scores{grid-row:5}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.tv-top .logo{font-size:clamp(26px,3.4vw,58px)}
.tv-join{display:flex;align-items:center;gap:1.2vw;font-family:var(--display);font-weight:800;text-transform:uppercase;color:var(--mute);font-size:clamp(14px,1.5vw,26px);text-align:right;line-height:1.1}
.tv-join b{color:var(--ink);text-transform:none;font-family:var(--body);font-weight:700}
.tv-join .codechip{font-size:clamp(28px,3.6vw,64px)}
.qr{background:#fff;border-radius:8px;padding:6px;line-height:0}
.qr svg{width:clamp(64px,7vw,120px);height:auto}
#tv-net{margin:0;text-align:center;color:#ffd27a;background:#3a2c12;border-radius:8px;padding:6px;font-size:clamp(14px,1.3vw,22px)}
#tv-main{min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:2vh}
#tv .board{height:100%;max-height:none;gap:.5vw;padding:.5vw}
#tv .cat{font-size:clamp(13px,1.55vw,30px);min-height:9vh;padding:.6vh .5vw}
#tv .tile{font-size:clamp(22px,4vw,76px);border-radius:6px}
#tv .tile:not(.used):hover{background:var(--tile-hi)}
.tv-banner{font-family:var(--display);font-weight:800;text-transform:uppercase;text-align:center;font-size:clamp(22px,2.6vw,46px);margin:0}
.tv-clue{background:var(--board);border-radius:16px;padding:4vh 4vw;display:flex;flex-direction:column;gap:3vh;align-items:center;text-align:center;flex:1;justify-content:center;min-height:0}
.tv-clue .meta{font-size:clamp(16px,1.8vw,32px)}
.tv-clue .clue{font-size:clamp(30px,4.6vw,92px);max-width:24ch}
.tv-clue .ans{font-size:clamp(28px,3.6vw,68px)}
.tv-clue .ans small{font-size:clamp(14px,1.5vw,26px)}
.tv-status{font-family:var(--display);font-weight:800;text-transform:uppercase;text-align:center;font-size:clamp(22px,3vw,56px);margin:0;min-height:1.1em}
.tv-status.go{color:var(--blood);font-family:var(--stencil);letter-spacing:.06em}
.tv-lobby{display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center}
.tv-lobby .step{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(20px,2.4vw,44px);margin:0;line-height:1.1}
.tv-lobby .url{font-family:var(--body);font-weight:700;color:var(--brass);font-size:clamp(16px,1.8vw,32px);word-break:break-all;margin:0}
.tv-lobby .bigqr{background:#fff;border-radius:14px;padding:14px;line-height:0;justify-self:center}
.tv-lobby .bigqr svg{width:clamp(180px,24vh,320px);height:auto}
.tv-lobby .bigcode{font-size:clamp(80px,11vw,200px);text-align:left}
#tv .chips .chip{font-size:clamp(16px,1.6vw,28px);padding:.6vh 1vw}
#tv .settings{max-width:900px}
#tv .splash .who{font-size:clamp(60px,10vw,190px)}
#tv .splash{flex:1;justify-content:center}
#tv .splash .meta{font-size:clamp(16px,2vw,36px)}
#tv .flist{gap:1vh}
#tv .frow{font-size:clamp(16px,1.8vw,32px);padding:1.2vh 1vw}
#tv .frow .btn.sm{font-size:clamp(14px,1.3vw,22px)}
#tv-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#101a21;border:1px dashed #5a4a26;border-radius:12px;padding:8px 12px}
#tv-ctrl .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b99248;margin-right:auto}
#tv-ctrl kbd{font-family:var(--body);font-size:12px;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;opacity:.7}
#tv-scores{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
#tv-scores .sc{min-width:clamp(110px,12vw,240px);padding:.8vh 1vw;border-top-width:6px}
#tv-scores .sc .n{font-size:clamp(13px,1.3vw,24px)}
#tv-scores .sc .p{font-size:clamp(24px,3vw,56px)}
#tv-scores .sc.buzzed{box-shadow:0 0 0 3px var(--c) inset;background:#1d2f3d}
#tv-scores .sc.out{opacity:.45}
@media (prefers-reduced-motion:no-preference){
  .enter{animation:flipin .45s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes flipin{from{transform:rotateX(65deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
  .ans.enter{animation:ansflip .5s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes ansflip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
  .splash.enter .who{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes slam{from{transform:scale(2) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
  .board.fill .tile:not(.used){animation:fillin .3s both}
  @keyframes fillin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .sc.bump{animation:bump .5s}
  @keyframes bump{40%{transform:translateY(-4px)}}
  body.flash{animation:flash .5s 3}
  @keyframes flash{50%{background:#5b4214}}
}
</style>
</head>
<body>

<div class="wrap" id="landing">
  <div class="hero">
    <h1 class="logo">ST. JEEZY <span>JEOPARDY</span></h1>
    <p id="status" class="muted">Loading…</p>
    <div class="card hidden" id="join-card">
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="16" autocomplete="nickname" enterkeyhint="next" placeholder="Type a name">
      <label for="code">Room code</label>
      <input id="code" type="text" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="ABCD">
      <button class="btn primary wide" id="btn-join" type="button">Join the game</button>
    </div>
    <div class="or hidden" id="or">Hosting? Open this page on a laptop or TV</div>
    <button class="btn wide hidden" id="btn-host" type="button">Host on this screen</button>
  </div>
</div>

<div class="wrap hidden" id="game">
  <header class="top"><h1 class="logo">ST. <span>JEEZY</span></h1><span class="codechip" id="g-code"></span><button class="pill mebtn" id="g-me" type="button" aria-label="Change your name or color"></button></header>
  <p id="conn" class="hidden"></p>
  <div id="ansbox" class="hidden"><p id="ans-clue"></p><div class="ansrow"><input id="ans-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" maxlength="80" placeholder="Type your answer"><button class="btn primary" id="ans-go" type="button">Send</button></div><div class="tbar"><i data-dl></i></div><p id="ans-hint" class="muted"></p></div>
  <div id="main"></div>
  <div id="hostbar" class="hidden"></div>
  <div class="scores" id="scores"></div>
</div>

<div id="tv" class="hidden">
  <header class="tv-top"><h1 class="logo">ST. JEEZY <span>JEOPARDY</span></h1><div class="tv-join" id="tv-join"></div></header>
  <p id="tv-net" class="hidden"></p>
  <main id="tv-main"></main>
  <div id="tv-ctrl"></div>

  hush();
  if(G.cur) G.board[G.cur.c][G.cur.r].used = true;
  G.cur = null; G.q = null; G.ans = null; G.winner = null; G.buzzOpen = false; G.locked = []; G.flipped = false; G.vote = null; G.guesses = [];
  if(G.board.every(col => col.every(t => t.used))){
    deadline(0);
    if(G.round === 1 && G.settings.dj){ G.phase = "roundend"; commit(); setTimeout(startRound2, 4500); }
    else toFinal();
    return;
  }
  if(!inGame(G.picker)) G.picker = players()[0] || null;
  G.phase = "board"; G.token = Date.now(); deadline(PICK_MS, "pick", autoPick); commit();
}
function autoPick(){ if(G.phase !== "board") return; const open = []; G.board.forEach((col, c) => col.forEach((t, r) => { if(!t.used) open.push([c, r]); })); open.sort((a, b) => a[1] - b[1]); if(open.length) openTile(...open[0]); }
function startRound2(){
  if(G.phase !== "roundend") return;
  const used = new Set(G.usedIds); G.round = 2; G.board = buildBoard(2, used); G.usedIds = [...used];
  const ids = players(); if(ids.length) G.picker = ids.sort((a,b) => (G.scores[a]||0) - (G.scores[b]||0))[0];
  G.phase = "board"; G.fill = Date.now(); G.token = Date.now(); SFX.fill(); deadline(PICK_MS, "pick", autoPick); commit();
}
function toFinal(){
  hush();
  const f = byId(G.finalId); Object.values(P).forEach(p => { delete p.fw; delete p.fa; });
  G.phase = "fcat"; G.cur = null; G.q = null; G.winner = null; G.buzzOpen = false; G.fDone = {}; G.fvote = null; G.fBase = {}; G.fin = {cat: G.cats[f.c], s: f.s};
  G.token = Date.now(); deadline(FWAGER_MS, "wager", finalClue); commit();
  speak("Final Jeopardy. The category is " + G.fin.cat + ". Make your wagers.");
}
const contenders = () => players().filter(id => (G.scores[id]||0) > 0);
let autoT = null;
function maybeAutoFinal(){ const c = contenders(); if(c.length && c.every(id => P[id].fw != null)){ clearTimeout(autoT); autoT = setTimeout(() => { if(G.phase === "fcat") finalClue(); }, 1200); } }
function finalClue(){ if(G.phase !== "fcat") return; const f = byId(G.finalId); G.phase = "fclue"; G.fin = {cat: G.cats[f.c], s: f.s, q: f.q}; G.fStart = Date.now(); G.token = Date.now(); commit(); SFX.flip(); scheduleFinalTimeout(); speak(f.q); }
function scheduleFinalTimeout(){ const left = Math.max(500, FINAL_MS + 500 - (Date.now() - (G.fStart||Date.now()))); deadline(left, "final", () => { SFX.times(); finalReveal(); }); G.dlLen = FINAL_MS; }
function maybeAutoReveal(){ const ids = players(); if(ids.length && ids.every(id => P[id].fa)){ clearTimeout(autoT); autoT = setTimeout(() => { if(G.phase === "fclue") finalReveal(); }, 1500); } }
function finalReveal(){
  if(G.phase !== "fclue") return; hush();
  const f = byId(G.finalId); G.phase = "freveal"; G.token = Date.now(); G.fin = {cat: G.cats[f.c], s: f.s, q: f.q, a: f.a, x: f.x};
  G.fHint = {}; G.fDone = {};
  for(const id of players()){ G.fBase[id] = G.scores[id] || 0; const txt = (P[id].fa || "").trim(); G.fHint[id] = txt ? judgeFor(txt, f, DF, KNOWN).verdict : "wrong"; setFinal(id, G.fHint[id] !== "wrong"); }
  deadline(10000, "winner", finish); commit();
}
function setFinal(id, right){ const w = P[id] && P[id].fw != null ? P[id].fw : 0; G.scores[id] = (G.fBase[id] || 0) + (right ? w : -w); G.fDone[id] = right ? "right" : "wrong"; }
function fJudge(id, right){ if(G.phase !== "freveal" || !P[id]) return; setFinal(id, right); right ? SFX.right() : SFX.wrong(); deadline(10000, "winner", finish); commit(); }
function fAcceptHints(){ if(G.phase !== "freveal") return; for(const id of players()) if(!G.fDone[id] && G.fHint[id] !== "maybe") setFinal(id, G.fHint[id] === "right"); commit(); }
const fAllJudged = () => players().every(id => G.fDone[id]);
function finish(){ if(G.phase !== "freveal" || !fAllJudged()) return; deadline(0); G.phase = "over"; SFX.fill(); commit();
  const top = players().sort((a,b) => G.scores[b] - G.scores[a])[0]; if(top) speak(nameOf(top) + " wins!"); }
function startGame(){ const ids = players(); if(!ids.length || G.phase !== "lobby") return; G.picker = ids[Math.floor(Math.random()*ids.length)]; G.phase = "board"; G.fill = Date.now(); G.token = Date.now(); SFX.fill(); deadline(PICK_MS, "pick", autoPick); commit(); }

/* the answer box lives outside #main so it is never rebuilt while someone types */
let ansFor = null, ansSent = null, ansOptimistic = null;
function amAnswering(){ return !!G && ((G.phase === "clue" && G.winner === me) || (G.phase === "ddclue" && G.picker === me)); }
function ansKey(){ return G.phase + ":" + (G.phase === "ddclue" ? G.cur && (G.cur.c + "-" + G.cur.r) : G.token); }
function renderAnsBox(){
  const box = $("ansbox"); if(!box || isHost) return;
  const waiting = G && ((G.phase === "clue" && !G.winner && ansOptimistic === G.token) || (G.phase === "dd" && ansOptimistic === "dd:" + G.token));   // tapped, result not back yet
  const show = G && (amAnswering() || waiting) && ansSent !== ansKey();
  if(!show){ if(!box.classList.contains("hidden")){ box.classList.add("hidden"); const i = $("ans-in"); i.blur(); i.value = ""; } return; }
  if(ansFor !== ansKey() && amAnswering()){ ansFor = ansKey(); }
  $("ans-clue").textContent = G.q ? G.q.q : "";
  $("ans-hint").textContent = amAnswering() ? "You're up. Spelling doesn't have to be perfect." : "Checking who buzzed first…";
  $("ans-go").disabled = !amAnswering();
  box.classList.remove("hidden");
}
function openAnsBox(){   // called inside a tap so phones will raise the keyboard
  const box = $("ansbox"), i = $("ans-in"); if(!box) return;
  box.classList.remove("hidden"); i.value = ""; try{ i.focus({preventScroll: true}); }catch(e){ i.focus(); }
}
function sendAnswer(){
  if(!amAnswering()) return;
  const key = ansKey(); if(ansSent === key) return;
  ansSent = key; const text = $("ans-in").value.trim();
  act({type: "guess", text, t: G.token});
  $("ans-in").blur(); $("ansbox").classList.add("hidden"); $("ans-in").value = "";
}
(function wireAnsBox(){
  const i = $("ans-in"); if(!i) return;
  $("ans-go").onclick = sendAnswer;
  i.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); sendAnswer(); } });
})();

function timerBar(){ return G.deadline ? `<div class="tbar"><i data-dl></i></div>` : ""; }
let clockOff = 0;
function remaining(){ if(!G || !G.deadline) return 0; return G.deadline - (isHost ? Date.now() : Date.now() - clockOff); }
function tickTimers(){
  if(!G) return;
  const left = remaining(), frac = G.dlLen ? Math.max(0, Math.min(1, left / G.dlLen)) : 0;
  document.querySelectorAll("[data-dl]").forEach(el => { el.style.width = (frac * 100) + "%"; el.classList.toggle("low", left < 4000); });
  document.querySelectorAll("[data-secs]").forEach(el => { el.textContent = Math.max(0, Math.ceil(left / 1000)); });
  // phones send whatever is typed just before time runs out
  if(!isHost && amAnswering() && ansSent !== ansKey() && G.deadline && left < 1200) sendAnswer();
}
setInterval(tickTimers, 200);

function wireMain(){
  document.querySelectorAll("#main .tile:not([disabled])").forEach(b => b.onclick = () => { document.querySelectorAll("#main .tile").forEach(x => x.disabled = true); act({type:"pick", c:+b.dataset.c, r:+b.dataset.r}); });
  const bzb = $("buzz"); if(bzb){ bzb.addEventListener("pointerdown", buzz); bzb.addEventListener("click", () => { if(G && sentTok === G.token && !G.winner) openAnsBox(); }); }
  const on = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  on("p-profile", openProfile);
  on("p-start", () => { $("p-start").disabled = true; act({type:"start"}); });
  on("p-again", () => { $("p-again").disabled = true; act({type:"again"}); });
  on("p-ddgo", () => { $("p-ddgo").disabled = true; ansOptimistic = "dd:" + G.token; act({type:"dd", amt: +$("p-ddw").value || 0}); openAnsBox(); });
  on("p-fwgo", () => { $("p-fwgo").disabled = true; act({type:"fw", w: +$("p-fw").value || 0}); });
